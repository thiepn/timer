<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A local-first workout interval timer with circuits, EMOM, AMRAP, boxing, run/walk, history and offline PWA support.">
  <title>Timer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#app-main" data-i18n="Skip to main content">Skip to main content</a>
  <div id="app" class="app-shell" data-theme="dark">
    <header id="app-header" class="app-header">
      <button class="brand" data-action="home" aria-label="Timer home">
        <span class="brand-mark" aria-hidden="true">◷</span>
        <span>Timer</span>
      </button>
      <div class="header-actions">
        <button id="install-btn" class="icon-btn hidden" data-action="install" title="Install app" aria-label="Install Timer">↓</button>
        <button class="icon-btn" data-action="create" title="Create timer" aria-label="Create timer">＋</button>
      </div>
    </header>

    <main id="app-main" tabindex="-1"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation">
      <button data-route="timer" class="nav-item active"><span aria-hidden="true">◷</span><span data-i18n="Timer">Timer</span></button>
      <button data-route="library" class="nav-item"><span aria-hidden="true">▦</span><span data-i18n="Library">Library</span></button>
      <button data-route="history" class="nav-item"><span aria-hidden="true">◴</span><span data-i18n="History">History</span></button>
      <button data-route="settings" class="nav-item"><span aria-hidden="true">⚙</span><span data-i18n="Settings">Settings</span></button>
    </nav>
  </div>


  <div id="a11y-live-polite" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="a11y-live-assertive" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <div id="update-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json,.timer.json,.timerbackup">

  <script type="module" src="./src/app.js"></script>
</body>
</html>
