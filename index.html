<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A local-first universal timer with quick countdowns, stopwatches, intervals, sequences, saved presets, history and offline PWA support.">
  <title>Timer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./visual-system.css">
</head>
<body>
  <a class="skip-link" href="#app-main" data-i18n="Skip to main content">Skip to main content</a>
  <div id="app" class="app-shell" data-theme="dark">
    <aside id="shell-rail" class="shell-rail" aria-label="Primary navigation">
      <button class="shell-rail-brand" data-action="home" aria-label="Timer home">
        <span class="shell-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="./icons.svg#i-timer"></use></svg></span>
        <span class="shell-rail-brand-copy"><strong>Timer</strong><small>Precision timing</small></span>
      </button>
      <nav class="shell-rail-nav">
        <button data-route="timer" class="nav-item shell-nav-item active"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-timer"></use></svg><span data-i18n="Timer">Timer</span></button>
        <button data-route="library" class="nav-item shell-nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-library"></use></svg><span data-i18n="Library">Library</span></button>
        <button data-route="history" class="nav-item shell-nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-history"></use></svg><span data-i18n="History">History</span></button>
        <button data-route="settings" class="nav-item shell-nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-settings"></use></svg><span data-i18n="Settings">Settings</span></button>
      </nav>
      <button class="shell-rail-create" data-action="create"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-plus"></use></svg><span>New timer</span></button>
    </aside>

    <header id="app-header" class="app-header">
      <button class="brand" data-action="home" aria-label="Timer home">
        <span class="brand-mark shell-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="./icons.svg#i-timer"></use></svg></span>
        <span class="brand-word">Timer</span>
      </button>
      <div class="shell-context" aria-hidden="true">
        <span id="shell-context-kicker">Timer</span>
        <strong id="shell-context-title">Quick Timer</strong>
      </div>
      <div class="header-actions">
        <button id="install-btn" class="icon-btn hidden" data-action="install" title="Install app" aria-label="Install Timer"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-download"></use></svg></button>
        <button class="icon-btn shell-create-icon" data-action="create" title="Create timer" aria-label="Create timer"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-plus"></use></svg></button>
      </div>
    </header>

    <main id="app-main" tabindex="-1"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation">
      <button data-route="timer" class="nav-item active"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-timer"></use></svg><span data-i18n="Timer">Timer</span></button>
      <button data-route="library" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-library"></use></svg><span data-i18n="Library">Library</span></button>
      <button data-route="history" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-history"></use></svg><span data-i18n="History">History</span></button>
      <button data-route="settings" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="./icons.svg#i-settings"></use></svg><span data-i18n="Settings">Settings</span></button>
    </nav>
  </div>


  <div id="a11y-live-polite" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="a11y-live-assertive" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <div id="update-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json,.timer.json,.timerbackup">

  <script type="module" src="./src/app.js"></script>
</body>
</html>
